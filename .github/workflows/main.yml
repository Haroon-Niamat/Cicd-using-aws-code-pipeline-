name: Build & Push Backend Docker Image
on:
  push:
    branches:
      - cicd-prod
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC authentication with AWS
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-west-1
      ROLE_NAME: d1-cicd-role
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit SHA (short)
        id: vars
        run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Private Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build, Tag & Push Docker Image
        run: |
          ECR_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${ECR_REPOSITORY}

          echo "Building Docker image..."
          docker build -t $ECR_URI:${COMMIT_SHA} -t $ECR_URI:latest .

          echo "Pushing Docker image with commit SHA tag..."
          docker push $ECR_URI:${COMMIT_SHA}

          echo "Pushing Docker image with latest tag..."
          docker push $ECR_URI:latest
